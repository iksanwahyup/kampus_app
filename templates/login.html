<h1>Login</h1>

{% if error %}
<div class="alert alert-danger">
    {{ error }}
</div>
{% endif %}

<form method="POST">
    <p>Username:</p>
    <input type="text" name="username">

    <p>Password:</p>
    <input type="password" name="password">

    <br><br>
    <button type="submit">Login</button>
</form>
