<h1>Tambah Mahasiswa</h1>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

<form method="POST">
    <p>Nama:</p>
    <input type="text" name="nama" required>

    <p>Nilai:</p>
    <input type="number" name="nilai" required>

    <br><br>
    <button type="submit">Simpan</button>
</form>

<br>
<a href="/">Kembali</a>
